<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <style>
    body{margin:0;background:#0a0e1a;color:#00e5ff;font-family:system-ui}
    #scroll-container{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
   .ficha{width:100%;scroll-snap-align:start;position:relative;cursor:pointer}
   .ficha img{width:100%;display:block}
   .hotspot{position:absolute;left:0;width:100%;border:2px dashed transparent}
   .hotspot:hover{border-color:#00e5ff;background:rgba(0,229,255,0.1)}
  </style>
</head>
<body>
  <div id="scroll-container">
    <!-- Aquí cargas tus fichas -->
    <div class="ficha" data-ficha="T10">
      <img src="assets/fichas/ficha_T10_91_95.webp" id="ficha-T10">
      <!-- Hotspots generados por JS desde mapping.json -->
    </div>
  </div>

  <div id="pregunta-modal" style="display:none;position:fixed;bottom:0;background:#000;padding:20px;width:100%">
    <h3 id="sim-titulo">SIM-91</h3>
    <p id="sim-pregunta"></p>
    <button onclick="mostrarTrampa()">Ver Trampa</button>
    <button onclick="hacerExamen()">Hacer Test</button>
  </div>

<script>
let mapping = null;
fetch('data/fichas_mapping.json').then(r=>r.json()).then(m=>mapping=m);

// Click en ficha -> mapea Y -> SIM
document.getElementById('scroll-container').addEventListener('click', e=>{
  const rect = e.currentTarget.getBoundingClientRect();
  const y = e.clientY - rect.top + e.currentTarget.scrollTop;
  const fichaEl = e.target.closest('.ficha');
  if(!fichaEl) return;

  const fichaId = fichaEl.dataset.ficha;
  const hotspots = mapping.fichas.find(f=>f.ficha_id.includes(fichaId)).hotspots;
  const panelHeight = fichaEl.offsetHeight / hotspots.length;
  const index = Math.floor((y % fichaEl.offsetHeight) / panelHeight);
  const sim = hotspots[index];

  document.getElementById('sim-titulo').innerText = sim.id;
  document.getElementById('sim-pregunta').innerText = sim.pregunta;
  document.getElementById('pregunta-modal').style.display='block';
});

// Scroll infinito
let observer = new IntersectionObserver(entries=>{
  if(entries[0].isIntersecting) cargarSiguienteFicha(); // T11, T12...
});
observer.observe(document.querySelector('.ficha:last-child'));

function cargarSiguienteFicha(){
  // fetch siguiente ficha HD y añadir al scroll
}
</script>
</body>
</html>
